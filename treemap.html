<link rel="stylesheet" href="styles.css">
<style>
  .treemap-wrap {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    aspect-ratio: 100 / 70;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .tm-cell {
    position: absolute;
    box-sizing: border-box;
    border: 2px solid #111;
    display: flex;
    overflow: hidden;
    cursor: default;
    transition: filter 0.15s;
  }
  .tm-cell:hover { filter: brightness(1.12); z-index: 5; }
  .tm-exist, .tm-new {
    height: 100%;
    flex-shrink: 0;
  }
  .tm-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 4px;
    text-align: center;
  }
  .tm-label .name {
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  .tm-label .sub {
    color: rgba(255,255,255,0.88);
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  /* Tooltip */
  .tm-tip {
    display: none;
    position: fixed;
    z-index: 100;
    background: rgba(20,24,36,0.94);
    color: #fff;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.65;
    pointer-events: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    max-width: 360px;
    backdrop-filter: blur(6px);
  }
  .tm-tip .tip-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 6px;
  }
  .tm-tip .tip-row { display: flex; justify-content: space-between; gap: 18px; }
  .tm-tip .tip-k { color: rgba(255,255,255,0.6); }
  .tm-tip .tip-v { font-weight: 600; text-align: right; }
  .tm-tip .tip-bar {
    margin-top: 8px;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .tm-tip .tip-bar-exist { height: 100%; }
  .tm-tip .tip-bar-new   { height: 100%; }
</style>
</head>
<body>
<header>

    <div class="pager">

      <a class="next" href="treemap-proj.html">다음 · 과제 트리맵 →</a>

  </section>
</main>

function fmt(n) { return n.toLocaleString('ko-KR'); }

const wrap = document.getElementById('treemap');
const tip  = document.getElementById('tip');

document.getElementById('st-total').textContent = fmt(DATA.total) + ' 억원';
document.getElementById('st-exist').textContent = fmt(DATA.exist_total) + ' 억원';
document.getElementById('st-new').textContent   = fmt(DATA.new_total) + ' 억원';
document.getElementById('st-n').textContent      = DATA.cells.length + ' 개';

DATA.cells.forEach(c => {
  const el = document.createElement('div');
  el.className = 'tm-cell';
  el.style.left   = c.x + '%';
  el.style.bottom  = c.y + '%';
  el.style.width   = c.w + '%';
  el.style.height  = c.h + '%';

  const existW = (c.ef * 100).toFixed(2) + '%';
  const newW   = ((1 - c.ef) * 100).toFixed(2) + '%';

  el.innerHTML = `
    <div class="tm-exist" style="width:${existW};background:${c.ec}"></div>
    <div class="tm-new"   style="width:${newW};background:${c.nc}"></div>
    <div class="tm-label">
      <div class="name" style="font-size:${Math.min(16, Math.max(8, Math.sqrt(c.w * c.h) * 0.9))}px">${c.short}</div>
      ${c.w > 6 && c.h > 7 ? `<div class="sub" style="font-size:${Math.min(13, Math.max(7, Math.sqrt(c.w * c.h) * 0.65))}px">${fmt(c.total)}억 (${c.pct}%)</div>` : ''}
    </div>
  `;

  el.addEventListener('mouseenter', e => {
    tip.style.display = 'block';
    tip.innerHTML = `
      <div class="tip-name">${c.name}</div>
      <div class="tip-row"><span class="tip-k">연간 연구비</span><span class="tip-v">${c.yearly}</span></div>
      <div class="tip-row"><span class="tip-k">총 예산</span><span class="tip-v">${fmt(c.total)}억 (${c.pct}%)</span></div>
      <div class="tip-row"><span class="tip-k">기존 예산</span><span class="tip-v">${fmt(c.exist)}억</span></div>
      <div class="tip-row"><span class="tip-k">신규 예산</span><span class="tip-v">${fmt(c.new)}억</span></div>
      <div class="tip-bar">
        <div class="tip-bar-exist" style="width:${(c.ef*100).toFixed(1)}%;background:${c.ec}"></div>
        <div class="tip-bar-new"   style="width:${((1-c.ef)*100).toFixed(1)}%;background:${c.nc}"></div>
      </div>
    `;
  });

  el.addEventListener('mousemove', e => {
    let tx = e.clientX + 14, ty = e.clientY + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (tx + tw > window.innerWidth - 8) tx = e.clientX - tw - 10;
    if (ty + th > window.innerHeight - 8) ty = e.clientY - th - 10;
    tip.style.left = tx + 'px';
    tip.style.top  = ty + 'px';
  });

  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

  wrap.appendChild(el);
});
