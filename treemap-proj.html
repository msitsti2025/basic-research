<link rel="stylesheet" href="styles.css">
<style>
  .treemap-wrap {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    aspect-ratio: 100 / 70;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .tm-cell {
    position: absolute;
    box-sizing: border-box;
    border: 2px solid #111;
    overflow: hidden;
    cursor: default;
    transition: filter 0.15s;
  }
  .tm-cell:hover { filter: brightness(1.12); z-index: 5; }
  .tm-grid {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 0;
  }
  .tm-box {
    box-sizing: border-box;
    border: 0.5px solid rgba(0,0,0,0.15);
  }
  .tm-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 4px;
    text-align: center;
  }
  .tm-label .name {
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 1px 4px rgba(0,0,0,0.55);
  }
  .tm-label .sub {
    color: rgba(255,255,255,0.88);
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  /* Tooltip */
  .tm-tip {
    display: none;
    position: fixed;
    z-index: 100;
    background: rgba(20,24,36,0.94);
    color: #fff;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13.5px;
    line-height: 1.65;
    pointer-events: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    max-width: 360px;
    backdrop-filter: blur(6px);
  }
  .tm-tip .tip-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 6px;
  }
  .tm-tip .tip-row { display: flex; justify-content: space-between; gap: 18px; }
  .tm-tip .tip-k { color: rgba(255,255,255,0.6); }
  .tm-tip .tip-v { font-weight: 600; text-align: right; }
  .tm-tip .tip-bar {
    margin-top: 8px;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .tm-tip .tip-bar-exist, .tm-tip .tip-bar-new { height: 100%; }
</style>

function fmt(n) { return n.toLocaleString('ko-KR'); }

const wrap = document.getElementById('treemap');
const tip  = document.getElementById('tip');

document.getElementById('st-n').textContent     = fmt(DATA.total_N) + ' 개';
document.getElementById('st-exist').textContent = fmt(DATA.total_exist) + ' 개';
document.getElementById('st-new').textContent   = fmt(DATA.total_new) + ' 개';
document.getElementById('st-sub').textContent   = DATA.cells.length + ' 개';

DATA.cells.forEach(c => {
  const el = document.createElement('div');
  el.className = 'tm-cell';
  el.style.left   = c.x + '%';
  el.style.bottom = c.y + '%';
  el.style.width  = c.w + '%';
  el.style.height = c.h + '%';

  // Grid of boxes
  const grid = document.createElement('div');
  grid.className = 'tm-grid';
  grid.style.gridTemplateColumns = `repeat(${c.gcols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${c.grows}, 1fr)`;

  const N = c.n_proj;
  const nExist = c.exist_count;

  // Column-major bottom-to-top ordering for left=기존, right=신규
  // Map each grid slot (row, col) to a rank
  const lastRowN = N - (c.grows - 1) * c.gcols;
  const slots = []; // array of {row, col} in column-major bottom-to-top order
  for (let col = 0; col < c.gcols; col++) {
    const maxRow = col < lastRowN ? c.grows - 1 : c.grows - 2;
    for (let row = maxRow; row >= 0; row--) {
      slots.push({ row, col });
    }
  }

  // Create a color map: slot index in column-major order → exist or new
  const colorMap = new Map();
  slots.forEach((s, rank) => {
    const key = s.row * c.gcols + s.col;
    colorMap.set(key, rank < nExist ? 'exist' : 'new');
  });

  // Render grid row-major (CSS grid order)
  let boxIdx = 0;
  for (let row = 0; row < c.grows; row++) {
    for (let col = 0; col < c.gcols; col++) {
      const box = document.createElement('div');
      box.className = 'tm-box';
      // Check if this slot has a project
      const slotKey = row * c.gcols + col;
      if (colorMap.has(slotKey)) {
        const isExist = colorMap.get(slotKey) === 'exist';
        box.style.background = isExist ? c.ec : c.nc;
      } else {
        box.style.background = 'transparent';
        box.style.border = 'none';
      }
      grid.appendChild(box);
    }
  }
  el.appendChild(grid);

  // Label overlay
  const fsName = Math.min(16, Math.max(7, Math.sqrt(c.w * c.h) * 0.85));
  const fsSub  = Math.min(13, Math.max(6, Math.sqrt(c.w * c.h) * 0.6));
  let labelHTML = `<div class="tm-label">`;
  labelHTML += `<div class="name" style="font-size:${fsName}px">${c.short}</div>`;
  if (c.w > 6 && c.h > 7) {
    labelHTML += `<div class="sub" style="font-size:${fsSub}px">${fmt(c.n_proj)}개</div>`;
  }
  labelHTML += `</div>`;
  el.insertAdjacentHTML('beforeend', labelHTML);

  // Tooltip
  el.addEventListener('mouseenter', e => {
    const ef = c.n_proj > 0 ? c.exist_count / c.n_proj : 0;
    tip.style.display = 'block';
    tip.innerHTML = `
      <div class="tip-name">${c.name}</div>
      <div class="tip-row"><span class="tip-k">과제당 연구비</span><span class="tip-v">${c.yearly}</span></div>
      <div class="tip-row"><span class="tip-k">총 예산</span><span class="tip-v">${fmt(c.total)}억 (${c.pct}%)</span></div>
      <div class="tip-row"><span class="tip-k">총 과제 수</span><span class="tip-v">${fmt(c.n_proj)}개</span></div>
      <div class="tip-row"><span class="tip-k">기존 과제</span><span class="tip-v">${fmt(c.exist_count)}개</span></div>
      <div class="tip-row"><span class="tip-k">신규 과제</span><span class="tip-v">${fmt(c.new_count)}개</span></div>
      <div class="tip-bar">
        <div class="tip-bar-exist" style="width:${(ef*100).toFixed(1)}%;background:${c.ec}"></div>
        <div class="tip-bar-new"   style="width:${((1-ef)*100).toFixed(1)}%;background:${c.nc}"></div>
      </div>
    `;
  });
  el.addEventListener('mousemove', e => {
    let tx = e.clientX + 14, ty = e.clientY + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (tx + tw > window.innerWidth - 8)  tx = e.clientX - tw - 10;
    if (ty + th > window.innerHeight - 8) ty = e.clientY - th - 10;
    tip.style.left = tx + 'px';
    tip.style.top  = ty + 'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

  wrap.appendChild(el);
});
</script>
